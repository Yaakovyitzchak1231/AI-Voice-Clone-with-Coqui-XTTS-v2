[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-voice-clone-xtts-v2"
version = "1.0.0"
description = "Free voice cloning for creators using Coqui XTTS-v2 on Google Colab"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Robert Hall"}
]
keywords = ["voice-cloning", "tts", "text-to-speech", "coqui", "xtts", "ai", "deep-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "TTS>=0.20.0",
    "torch==2.1.0",
    "torchaudio==2.1.0",
    "transformers<4.50.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/Yaakovyitzchak1231/AI-Voice-Clone-with-Coqui-XTTS-v2"
Documentation = "https://github.com/Yaakovyitzchak1231/AI-Voice-Clone-with-Coqui-XTTS-v2#readme"
Repository = "https://github.com/Yaakovyitzchak1231/AI-Voice-Clone-with-Coqui-XTTS-v2"
Issues = "https://github.com/Yaakovyitzchak1231/AI-Voice-Clone-with-Coqui-XTTS-v2/issues"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
